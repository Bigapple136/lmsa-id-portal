<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#0D3B1A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle pattern - medical cross -->
  <g opacity="0.05" fill="white">
    <rect x="100" y="500" width="40" height="120" rx="8"/>
    <rect x="70" y="530" width="100" height="40" rx="8"/>
    <rect x="1050" y="80" width="40" height="120" rx="8"/>
    <rect x="1020" y="110" width="100" height="40" rx="8"/>
  </g>
  
  <!-- LMSA Seal - Outer Ring -->
  <circle cx="600" cy="260" r="120" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="600" cy="260" r="108" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- LMSA Seal - Text Arc (top) -->
  <path id="topArc" d="M 500 260 A 100 100 0 0 1 700 260" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">LIBERIA MEDICAL STUDENTS ASSOCIATION</textPath>
  </text>
  
  <!-- LMSA Seal - Text Arc (bottom) -->
  <path id="bottomArc" d="M 500 260 A 100 100 0 0 0 700 260" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">GREEN SNAKE INITIATIVE</textPath>
  </text>
  
  <!-- LMSA Seal - Stars -->
  <polygon points="495,260 498,268 506,268 500,273 502,281 495,276 488,281 490,273 484,268 492,268" fill="white"/>
  <polygon points="705,260 708,268 716,268 710,273 712,281 705,276 698,281 700,273 694,268 702,268" fill="white"/>
  
  <!-- LMSA Seal - Inner Circle -->
  <circle cx="600" cy="260" r="65" fill="white" opacity="0.1"/>
  <circle cx="600" cy="260" r="60" fill="none" stroke="white" stroke-width="1.5"/>
  
  <!-- Book -->
  <rect x="560" y="235" width="80" height="55" fill="white" opacity="0.9"/>
  <line x1="600" y1="235" x2="600" y2="290" stroke="#1B5E20" stroke-width="2"/>
  <path d="M 565 240 Q 582 248 598 240" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <path d="M 602 240 Q 618 248 635 240" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <path d="M 565 252 Q 582 260 598 252" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <path d="M 602 252 Q 618 260 635 252" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <path d="M 565 264 Q 582 272 598 264" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <path d="M 602 264 Q 618 272 635 264" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  
  <!-- Snake -->
  <path d="M 585 255 Q 575 245 585 235 Q 595 225 605 235 Q 615 245 605 255" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>
  <circle cx="590" cy="240" r="2" fill="#1B5E20"/>
  <circle cx="600" cy="238" r="2" fill="#1B5E20"/>
  
  <!-- Candle -->
  <rect x="625" y="245" width="8" height="30" fill="#1B5E20"/>
  <ellipse cx="629" cy="245" rx="5" ry="8" fill="#FFA726"/>
  <ellipse cx="629" cy="243" rx="3" ry="5" fill="#FFEE58"/>
  
  <!-- LMSA Text in Seal -->
  <text x="600" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">LMSA</text>
  
  <!-- Founded Year -->
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" opacity="0.8">Founded 1973</text>
  
  <!-- Main Title -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">LMSA ID Card Portal</text>
  
  <!-- Subtitle -->
  <text x="600" y="465" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.9">Student ID Card Generation &amp; Record Management</text>
  
  <!-- Decorative Line -->
  <rect x="450" y="485" width="300" height="2" fill="white" opacity="0.5" rx="1"/>
  
  <!-- Bottom Text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.7">A.M. Dogliotti College of Medicine • University of Liberia</text>
  
  <!-- Corner Accents -->
  <rect x="40" y="40" width="60" height="3" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="40" y="40" width="3" height="60" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="1100" y="40" width="60" height="3" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="1157" y="40" width="3" height="60" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="40" y="587" width="60" height="3" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="40" y="530" width="3" height="60" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="1100" y="587" width="60" height="3" fill="white" opacity="0.3" rx="1.5"/>
  <rect x="1157" y="530" width="3" height="60" fill="white" opacity="0.3" rx="1.5"/>
</svg>
